version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "javascript"
    ignore:
      # vite 8 is not yet supported by @tailwindcss/vite (requires ^5||^6||^7)
      - dependency-name: "vite"
        versions: [">= 8"]
      # eslint 10 is not yet supported by eslint-plugin-react (requires ^9.7)
      - dependency-name: "eslint"
        versions: [">= 10"]

  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "php"
