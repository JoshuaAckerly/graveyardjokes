name: Generate sitemap index

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      APP_URL: https://graveyardjokes.com
      AUTH_DB_HOST: 127.0.0.1
      AUTH_DB_PORT: 3306
      AUTH_DB_DATABASE: graveyardjokes_test
      AUTH_DB_USERNAME: graveyardjokes
      AUTH_DB_PASSWORD: password
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: graveyardjokes_test
          MYSQL_USER: graveyardjokes
          MYSQL_PASSWORD: password
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, curl

      - name: Install Composer dependencies
        run: |
          composer install --no-progress --prefer-dist --no-interaction

      - name: Setup env file
        run: |
          cp .env.example .env
          sed -i 's|APP_URL=.*|APP_URL=${{ env.APP_URL }}|' .env
          sed -i 's|DB_CONNECTION=.*|DB_CONNECTION=sqlite|' .env
          sed -i 's|# DB_DATABASE=.*|DB_DATABASE=database/sitemap.sqlite|' .env || true
          echo "DB_DATABASE=database/sitemap.sqlite" >> .env
          touch database/sitemap.sqlite

      - name: Generate APP_KEY if missing
        run: php artisan key:generate --ansi

      - name: Run migrations
        run: php artisan migrate --no-interaction --force

      - name: Generate main sitemap
        run: |
          php artisan app:generate-sitemap --url=${{ env.APP_URL }}
      
      - name: Generate sitemap index with validation
        run: |
          php artisan app:generate-sitemap-index --url=${{ env.APP_URL }} --validate

      - name: Commit and push generated sitemap if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}"
          # Only commit if files changed
          if git status --porcelain | grep -q "public/sitemap.xml\|public/sitemap_index.xml\|public/sitemap_validation_summary.md"; then
            git add public/sitemap.xml public/sitemap_index.xml public/sitemap_validation_summary.md || true
            git commit -m "chore: update sitemaps [skip ci]" || echo "No changes to commit"
            git push origin main
          else
            echo "No changes to sitemap files; skipping commit"
          fi
